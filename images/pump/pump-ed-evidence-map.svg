<title id="t">负压、暂时性充血、潜在组织损伤与勃起功能变化的证据关系</title><desc id="d">图示负压和暂时充血有物理联系，负压相关组织损伤是已报告风险，但个体持续的勃起功能变化尚不能由泵后水肿单独证明。其他因素也可能参与。</desc><rect x="0" y="0" width="1280" height="720" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="0"/>
<text x="58" y="65" class="hd">“泵后变化”不等于“已证明永久 ED”</text>
<text x="58" y="103" class="subtitle">分清直接观察、机制风险与长期因果推断</text>
<rect x="61" y="156" width="300" height="110" rx="22" fill="#f1f7fc" stroke="#bdd2e2" stroke-width="1.5"/>
<text x="91" y="206" class="h">负压器械作用</text>
<text x="91" y="239" class="small">外部压差变化</text>
<rect x="472" y="142" width="333" height="118" rx="22" fill="#edf7f6" stroke="#c9dfda" stroke-width="1.5"/>
<text x="501" y="189" class="h">短暂血液充盈</text>
<text x="501" y="223" class="small">体积 / 硬度可改变</text>
<rect x="472" y="332" width="333" height="120" rx="22" fill="#fff5ee" stroke="#e9d1c0" stroke-width="1.5"/>
<text x="501" y="379" class="h">可能出现不良反应</text>
<text x="501" y="414" class="small">瘀点 · 水肿 · 痛 · 麻木</text>
<rect x="922" y="280" width="290" height="176" rx="22" fill="#fff8f8" stroke="#e9caca" stroke-width="1.5"/>
<text x="947" y="329" class="h">持续功能改变？</text>
<text x="947" y="370" class="small">需要临床评估与</text>
<text x="947" y="404" class="small">长期随访判断因果</text>
<rect x="61" y="476" width="744" height="96" rx="22" fill="#f7f6fc" stroke="#dcd8ec" stroke-width="1.5"/>
<text x="91" y="516" class="h">其他可能的影响因素</text>
<text x="91" y="550" class="small">激素 · 疼痛 · 药物 · 神经 · 一般健康 · 情境</text>
<path d="M361 207 H467" stroke="#50667b" stroke-width="3" fill="none" marker-end="url(#arr)"/><text x="385" y="188" class="tiny">机制</text>
<path d="M218 266 V393 H466" stroke="#50667b" stroke-width="3" fill="none" marker-end="url(#arr)"/><text x="246" y="376" class="tiny">可能的风险</text>
<path d="M805 395 H914" stroke="#a66c62" stroke-width="3.5" stroke-dasharray="9 7" fill="none" marker-end="url(#dasharr)"/><text x="808" y="376" class="tiny">不能仅据此确证</text>
<path d="M805 515 H1070 V463" stroke="#a66c62" stroke-width="3.5" stroke-dasharray="9 7" fill="none" marker-end="url(#dasharr)"/><rect x="61" y="602" width="1151" height="78" rx="16" fill="#f4f7f9" stroke="#dbe3e7" stroke-width="1.5"/>
<text x="84" y="635" class="small">实线：一般机制或已有风险报告</text>
<text x="84" y="664" class="small">虚线：个体的长期因果关系尚不能仅凭症状、照片或时间先后判定</text>
